apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.5.0
      helm:
        values: |
          fullnameOverride: kube-prometheus-stack
          grafana:
            adminPassword: admin
            service:
              type: ClusterIP
          prometheus:
            prometheusSpec:
              retention: 2d
              serviceMonitorSelectorNilUsesHelmValues: false
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
          alertmanager:
            alertmanagerSpec:
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
              storage:
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 1Gi
          prometheusOperator:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
          kube-state-metrics:
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
          prometheus-node-exporter:
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
