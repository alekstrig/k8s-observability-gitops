apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  source:
    repoURL: https://helm.elastic.co
    chart: eck-operator
    targetRevision: 3.5.0
    helm:
      values: |
        managedNamespaces:
          - logging
        installCRDs: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: observability
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  source:
    repoURL: https://helm.elastic.co
    chart: eck-stack
    targetRevision: 0.20.0
    helm:
      values: |
        eck-elasticsearch:
          enabled: true
          fullnameOverride: elasticsearch
          nodeSets:
            - name: default
              count: 1
              config:
                node.store.allow_mmap: false
              podTemplate:
                spec:
                  containers:
                    - name: elasticsearch
                      resources:
                        requests:
                          cpu: 250m
                          memory: 1Gi
                        limits:
                          cpu: 1
                          memory: 1.5Gi
              volumeClaimTemplates:
                - metadata:
                    name: elasticsearch-data
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 2Gi
        eck-kibana:
          enabled: true
          count: 1
          elasticsearchRef:
            name: elasticsearch
          podTemplate:
            spec:
              containers:
                - name: kibana
                  resources:
                    requests:
                      cpu: 100m
                      memory: 512Mi
                    limits:
                      cpu: 500m
                      memory: 768Mi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
